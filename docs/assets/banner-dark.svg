    <text x="756" y="176" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#e5e9ea">correct-horse-battery-staple</text>

    <line x1="964" y1="206" x2="964" y2="240" stroke="#79aadb" stroke-width="2"/>
    <path d="M957 234 L964 244 L971 234" fill="none" stroke="#79aadb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="980" y="229" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#79aadb">Argon2id → AES-256-GCM</text>


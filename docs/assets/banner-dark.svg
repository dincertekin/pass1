    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1c2226"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0.35" stop-color="#0e1113"/><stop offset="1" stop-color="#0e1113" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="14" fill="#0e1113"/>
